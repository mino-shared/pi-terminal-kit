# Minimal core verified with a private tmux socket.
set -g mouse on
set -g extended-keys on
set -g extended-keys-format csi-u

# Pass Ctrl+S through to the foreground application without changing tmux's prefix.
bind -n C-s send-keys C-s

# pi-codrive sets @pi_codrive_role per pane.
# Cyan marks the orchestrator, magenta marks subagents, and muted gray marks shells.
set -g pane-border-status top
set -g pane-border-format '#{?#{==:#{@pi_codrive_role},orchestrator},#[fg=cyan,bold] ORCHESTRATOR ,#{?#{==:#{@pi_codrive_role},subagent},#[fg=magenta,bold] SUBAGENT ,#[fg=colour245] SHELL }}#[default]#{pane_index} '
